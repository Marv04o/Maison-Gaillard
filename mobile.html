<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maison Gaillard — Version téléphone</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="img/favicon-64.png">
<style>
  :root{color-scheme:dark;--nuit:#1B2E20;--or:#F6BF34;--creme:#F5EDDF}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--nuit);color:var(--creme);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .stage{min-height:100%;display:grid;place-items:center;gap:18px;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
  .top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:center;text-align:center}
  .top a{color:var(--or);text-decoration:none;font-weight:600}
  .top a:hover{text-decoration:underline}
  .phone{width:min(414px,100%);height:min(868px,calc(100vh - 140px));min-height:560px;padding:12px;border-radius:52px;background:#0d1610;box-shadow:0 0 0 2px #2f4a35,0 40px 90px rgba(0,0,0,.55)}
  .phone iframe{width:100%;height:100%;border:0;border-radius:40px;background:var(--nuit);display:block}
  .hint{opacity:.75;font-size:.9rem;text-align:center;margin:0}
  @media (max-width:500px){
    /* Sur un vrai téléphone, on ouvre directement la maquette en plein écran */
    .phone{height:calc(100vh - 120px);border-radius:28px;padding:6px}
    .phone iframe{border-radius:22px}
  }
</style>
</head>
<body>
  <main class="stage" aria-label="Aperçu téléphone">
    <div class="top">
      <strong>Maison Gaillard · maquette téléphone</strong>
      <a href="index.html">← Proposition</a>
      <a href="site.html">Version ordinateur</a>
    </div>
    <div class="phone"><iframe src="site.html" title="Maquette Maison Gaillard, affichage téléphone (390 × 844)"></iframe></div>
    <p class="hint">Faites défiler dans l’écran. Sur votre téléphone, ouvrez directement la maquette.</p>
  </main>
</body>
</html>
